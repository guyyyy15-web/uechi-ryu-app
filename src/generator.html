<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחולל אימון – אוצ'י ריו | Training Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Noto+Serif+JP:wght@700&display=swap');
:root{--bg:#e8dcc0;--card:#faf5e6;--gold:#97711a;--red:#a8271a;--blue:#1f7699;--w:#2b2013;--gr:#7d6b4d;--border:#d9c8a0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--w);font-family:'Heebo',sans-serif;padding:1rem;}
header{text-align:center;padding:1.5rem 1rem 1rem;border-bottom:2px solid var(--gold);margin-bottom:1.5rem;}
.main-title{font-family:'Noto Serif JP',serif;font-size:2.4rem;color:var(--gold);letter-spacing:.2em;}
.sub-title{font-size:.9rem;color:var(--gr);margin-top:.3rem;letter-spacing:.1em;}
.app-nav{display:flex;justify-content:center;gap:.5rem;margin-top:.9rem;flex-wrap:wrap;}
.app-nav a{color:var(--gr);text-decoration:none;font-size:.8rem;padding:.4rem 1.1rem;border:1px solid var(--border);border-radius:20px;transition:.15s;font-weight:700;}
.app-nav a:hover{border-color:var(--gold);color:var(--gold);}
.app-nav a.active{background:var(--gold);color:#000;border-color:var(--gold);}
.wrap{max-width:760px;margin:0 auto;}
.intro-note{background:#f6ecd2;border:1px solid #e0cc9c;border-right:4px solid var(--gold);margin:0 auto 1.5rem;padding:.8rem 1rem;font-size:.8rem;color:var(--w);line-height:1.7;}
.intro-note strong{color:var(--gold);}
.gen-btn{display:block;margin:0 auto 1.8rem;background:var(--gold);color:#faf5e6;border:none;font-size:1rem;font-weight:700;padding:.9rem 2.4rem;cursor:pointer;font-family:'Heebo',sans-serif;letter-spacing:.05em;transition:.15s;}
.gen-btn:hover{opacity:.85;}
.workout{display:none;}
.workout.show{display:block;}
.w-section-title{font-size:.85rem;color:var(--gold);font-weight:700;margin:1.6rem 0 .7rem;padding-right:.3rem;border-right:3px solid var(--gold);}
.step{display:flex;gap:.9rem;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.9rem 1rem;margin-bottom:.8rem;cursor:pointer;transition:.15s;flex-wrap:wrap;}
.step:hover{border-color:var(--gold);}
.step.done{opacity:.55;}
.step.done .s-title{text-decoration:line-through;}
.s-check{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--gold);font-weight:900;margin-top:.1rem;}
.step.done .s-check{background:var(--gold);color:#faf5e6;}
.s-body{flex:1;}
.s-top{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap;}
.s-title{font-size:.92rem;font-weight:700;color:var(--w);}
.s-dur{font-size:.65rem;color:var(--gold);background:#f3e6c4;padding:.15rem .5rem;border-radius:10px;white-space:nowrap;}
.s-desc{font-size:.76rem;color:var(--gr);line-height:1.6;margin-top:.3rem;}
.s-sub{font-size:.68rem;color:var(--gr);margin-top:.15rem;letter-spacing:.03em;}
.s-sub .s-jp{font-family:'Noto Serif JP',serif;color:var(--gold);margin-left:.4rem;}
.video-wrap.video-wrap-sm{width:64px;height:64px;padding-top:0;flex:0 0 auto;}
.video-wrap.video-wrap-sm .play-overlay span{font-size:1rem;}
.video-wrap.video-wrap-sm.playing{width:100%;height:auto;padding-top:56.25%;flex:1 1 100%;}
.empty-state{text-align:center;color:var(--gr);padding:1rem;font-size:.8rem;}
footer{text-align:center;padding:1.5rem;color:#7d6b4d;font-size:.72rem;border-top:1px solid var(--border);margin-top:2rem;font-family:'Noto Serif JP',serif;letter-spacing:.1em;}
</style>
</head>
<body>
<header>
  <div class="main-title">稽古</div>
  <div class="sub-title">מחולל אימון · לחיצה אחת, אימון אקראי</div>
</header>

<div class="wrap">
  <div class="intro-note">
    <strong>איך זה עובד:</strong> לחיצה אחת בונה אימון אקראי מתוך התרגילים באתר – חימום קבוע,
    4 תרגילי הוג'ו אונדו, 3 טכניקות בסיס (קיהון), וקאטה אחת, כל אחד עם מספר חזרות אקראי.
    לחצו שוב לאימון חדש. אפשר לסמן כל שלב שסיימתם.
  </div>

  <button class="gen-btn" id="genBtn">צור אימון</button>

  <div class="workout" id="workoutResult"></div>
</div>

<footer>稽古 · Training Generator</footer>

<script>
function pickRandom(arr, n){
  const copy = arr.slice();
  const out = [];
  for(let i=0;i<n && copy.length;i++){
    const idx = Math.floor(Math.random()*copy.length);
    out.push(copy.splice(idx,1)[0]);
  }
  return out;
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function buildWorkout(){
  const warmupSteps = Array.from(document.querySelectorAll('#view-warmup .step')).map(function(el){
    var durEl = el.querySelector('.s-dur'), descEl = el.querySelector('.s-desc');
    return {title: el.querySelector('.s-title').textContent, dur: durEl ? durEl.textContent : '', desc: descEl ? descEl.textContent : ''};
  });

  const hojoAll = Array.from(document.querySelectorAll('#view-hojo .exercise')).map(function(el){
    const vw = el.querySelector('.video-wrap');
    const photo = el.querySelector('.real-ref .rr-frame img');
    return {
      num: el.querySelector('.ex-num').textContent,
      name: el.querySelector('.ex-names .he').textContent,
      jp: el.querySelector('.ex-names .jp').textContent,
      ro: el.querySelector('.ex-names .ro').textContent,
      thumb: photo ? photo.src : (vw ? 'https://img.youtube.com/vi/' + vw.dataset.vid + '/hqdefault.jpg' : ''),
      link: vw ? vw.href : '',
      vid: vw ? vw.dataset.vid : ''
    };
  });
  const hojoPicked = pickRandom(hojoAll, 4).map(function(h){
    return {num:h.num, name:h.name, jp:h.jp, ro:h.ro, thumb:h.thumb, link:h.link, vid:h.vid, reps: randInt(8,15)};
  });

  const kihonAll = (typeof TERMS !== 'undefined') ? TERMS.filter(function(t){return t.cat==='strike';}) : [];
  const kihonPicked = pickRandom(kihonAll, 3).map(function(k){
    return {name:k.he, ro:k.ro, jp:k.jp, thumb:k.img||'', link:k.vid?('https://www.youtube.com/watch?v='+k.vid):'', vid:k.vid||'', reps: randInt(10,20)};
  });

  const kataAll = Array.from(document.querySelectorAll('#view-kata .kata')).map(function(el){
    const belt = el.querySelector('.k-belt');
    const vw = el.querySelector('.video-wrap');
    return {
      name: el.querySelector('.k-names .he').textContent,
      jp: el.querySelector('.k-names .jp').textContent,
      ro: el.querySelector('.k-names .ro').textContent,
      belt: belt ? belt.textContent : '',
      thumb: vw ? 'https://img.youtube.com/vi/' + vw.dataset.vid + '/hqdefault.jpg' : '',
      link: vw ? vw.href : '',
      vid: vw ? vw.dataset.vid : ''
    };
  });
  const kataPicked = pickRandom(kataAll, 1).map(function(k){
    return {name:k.name, jp:k.jp, ro:k.ro, belt:k.belt, thumb:k.thumb, link:k.link, vid:k.vid, reps: randInt(2,4)};
  });

  return {warmupSteps: warmupSteps, hojoPicked: hojoPicked, kihonPicked: kihonPicked, kataPicked: kataPicked};
}

function subHtml(jp, ro){
  if(!jp && !ro) return '';
  return (jp ? '<span class="s-jp">' + jp + '</span>' : '') + (ro ? '<span class="s-ro">' + ro + '</span>' : '');
}

function stepHtml(title, dur, desc, sub, thumb, link, vid){
  var thumbHtml = '';
  if (thumb && vid) {
    var href = link || ('https://www.youtube.com/watch?v=' + vid);
    thumbHtml = '<a class="video-wrap video-wrap-sm" href="' + href + '" target="_blank" rel="noopener" data-vid="' + vid + '">'
      + '<img src="' + thumb + '" alt="" loading="lazy">'
      + '<div class="play-overlay"><span>▶</span></div></a>';
  }
  return '<div class="step">' + thumbHtml + '<div class="s-check">✓</div><div class="s-body">'
    + '<div class="s-top"><span class="s-title">' + title + '</span><span class="s-dur">' + dur + '</span></div>'
    + (sub ? '<div class="s-sub">' + sub + '</div>' : '')
    + (desc ? '<div class="s-desc">' + desc + '</div>' : '')
    + '</div></div>';
}

function renderWorkout(workout){
  const el = document.getElementById('workoutResult');
  let html = '';

  html += '<div class="w-section-title">1. חימום</div>';
  workout.warmupSteps.forEach(function(w){
    html += stepHtml(w.title, w.dur, w.desc);
  });

  html += '<div class="w-section-title">2. הוג\'ו אונדו</div>';
  workout.hojoPicked.forEach(function(h){
    html += stepHtml(h.num + '. ' + h.name, h.reps + ' חזרות', '', subHtml(h.jp, h.ro), h.thumb, h.link, h.vid);
  });

  html += '<div class="w-section-title">3. תרגול בסיס (קיהון)</div>';
  if(workout.kihonPicked.length===0){
    html += '<div class="empty-state">אין מונחי מכות זמינים כרגע.</div>';
  }
  workout.kihonPicked.forEach(function(k){
    html += stepHtml(k.name, k.reps + ' חזרות לכל צד', '', subHtml(k.jp, k.ro), k.thumb, k.link, k.vid);
  });

  html += '<div class="w-section-title">4. קאטה</div>';
  workout.kataPicked.forEach(function(k){
    html += stepHtml(k.name, k.reps + ' חזרות', k.belt, subHtml(k.jp, k.ro), k.thumb, k.link, k.vid);
  });

  el.innerHTML = html;
  el.classList.add('show');

  el.querySelectorAll('.step').forEach(function(step){
    step.addEventListener('click', function(e){
      if (e.target.closest('.video-wrap')) return;
      step.classList.toggle('done');
    });
  });
}

document.getElementById('genBtn').addEventListener('click', function(){
  renderWorkout(buildWorkout());
});
</script>
</body>
</html>
